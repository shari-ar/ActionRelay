name: ActionRelay Batch Worker
run-name: ActionRelay Batch ${{ inputs.batch_id }}

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Batch ID
        required: true
        type: string
      batch_payload_b64:
        description: Base64 encoded request batch payload
        required: true
        type: string
      max_response_bytes_per_request:
        description: Max response bytes per request
        required: false
        default: "65536"
        type: string
      request_timeout_ms:
        description: Per-request timeout in milliseconds
        required: false
        default: "8000"
        type: string
      worker_concurrency:
        description: Worker fetch concurrency
        required: false
        default: "4"
        type: string

permissions:
  contents: write

jobs:
  process-batch:
    name: Process Batch ${{ inputs.batch_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run batch worker
        env:
          ACTIONRELAY_BATCH_B64: ${{ inputs.batch_payload_b64 }}
          ACTIONRELAY_RESULT_PATH: worker/out/result-package.json
          ACTIONRELAY_MAX_RESPONSE_BYTES: ${{ inputs.max_response_bytes_per_request }}
          ACTIONRELAY_REQUEST_TIMEOUT_MS: ${{ inputs.request_timeout_ms }}
          ACTIONRELAY_WORKER_CONCURRENCY: ${{ inputs.worker_concurrency }}
        run: node worker/run-batch.mjs

      - name: Publish result package to results branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const branch = "actionrelay-results";
            const path = `results/${process.env.BATCH_ID}.json`;
            const message = `actionrelay result ${process.env.BATCH_ID}`;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoMeta = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoMeta.data.default_branch;
            const baseRef = context.ref.startsWith("refs/heads/")
              ? context.ref.replace("refs/heads/", "")
              : defaultBranch;

            const base = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: baseRef
            });

            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: base.data.commit.sha
              });
            }

            const content = fs.readFileSync("worker/out/result-package.json", "utf8");
            const encoded = Buffer.from(content, "utf8").toString("base64");

            let currentSha = undefined;
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch
              });
              if (!Array.isArray(current.data)) {
                currentSha = current.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message,
              content: encoded,
              sha: currentSha
            });
        env:
          BATCH_ID: ${{ inputs.batch_id }}
