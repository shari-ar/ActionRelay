name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to (for manual recovery)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-release:
    name: Package And Upload Release Assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build cross-platform binaries and checksums
        run: bash ./scripts/release/build-client-binaries.sh "${RELEASE_TAG}"

      - name: Upload workflow artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: actionrelay-release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload assets to published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were generated under dist/"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
