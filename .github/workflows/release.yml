name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-assets:
    name: Build Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build cross-platform binaries and checksums
        run: bash ./scripts/release/build-client-binaries.sh "${GITHUB_REF_NAME}"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: actionrelay-release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-assets
    steps:
      - name: Download release assets artifact
        uses: actions/download-artifact@v4
        with:
          name: actionrelay-release-assets
          path: dist

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
