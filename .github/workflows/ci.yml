name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod

      - name: Verify client build and tests
        working-directory: client
        run: |
          go test ./...

      - name: Verify gofmt
        working-directory: client
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

  worker:
    name: Worker (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Static syntax check
        run: node --check worker/run-batch.mjs

      - name: Worker smoke test
        run: node scripts/ci/smoke-worker.mjs

  schemas-and-docs:
    name: Schemas and Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Validate JSON schemas
        run: node scripts/ci/validate-schemas.mjs

      - name: Validate release readiness invariants
        run: node scripts/ci/validate-release-readiness.mjs

      - name: Validate final pre-v1.0 readiness
        run: node scripts/ci/validate-final-readiness.mjs
